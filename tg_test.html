<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test ntfy</title>
</head>
<body style="background:#0f2352;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;">
<div style="color:white;font-size:18px;margin-bottom:24px;">Test Notificación ntfy</div>
<button onclick="enviar()" style="padding:20px 40px;font-size:18px;background:#27ae60;border:none;border-radius:12px;color:white;cursor:pointer;margin-bottom:20px;">
  Enviar notificación
</button>
<div id="resultado" style="color:white;font-size:14px;text-align:center;padding:20px;"></div>
<script>
function enviar(){
  var r = document.getElementById('resultado');
  r.textContent = 'Enviando...';
  fetch('https://ntfy.sh/Secciondis', {
    method: 'POST',
    body: 'Test desde app - ' + new Date().toLocaleTimeString('es-AR')
  })
  .then(function(res){ r.textContent = 'Respuesta: ' + res.status; })
  .catch(function(e){ r.textContent = 'Error: ' + e.message; });
}
</script>
</body>
</html>
