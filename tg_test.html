<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Telegram</title>
</head>
<body style="background:#0f2352;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;">

<div style="color:white;font-size:18px;margin-bottom:24px;text-align:center;">Test Notificación Telegram</div>

<button onclick="enviar()" style="padding:20px 40px;font-size:18px;background:#27ae60;border:none;border-radius:12px;color:white;cursor:pointer;margin-bottom:20px;">
  Enviar notificación
</button>

<div id="resultado" style="color:white;font-size:14px;text-align:center;padding:20px;"></div>

<script>
function enviar(){
  var r = document.getElementById('resultado');
  r.textContent = 'Enviando...';
  
  var msg = 'Test desde app - ' + new Date().toLocaleTimeString('es-AR');
  var url = 'https://telegram-notify.silviolobo47.workers.dev/?msg=' + encodeURIComponent(msg);
  
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onload = function(){
    r.textContent = 'Respuesta: ' + xhr.responseText;
  };
  xhr.onerror = function(){
    r.textContent = 'Error de red';
  };
  xhr.ontimeout = function(){
    r.textContent = 'Timeout';
  };
  xhr.timeout = 10000;
  xhr.send();
}
</script>
</body>
</html>
